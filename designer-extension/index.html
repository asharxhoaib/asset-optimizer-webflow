<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Asset Optimizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Asset Optimizer</h1>
      <p class="muted">Audit images, fix alt text, shrink files and keep folders tidy.</p>
    </header>

    <section class="card" id="connect" hidden>
      <h2>Connect</h2>
      <p class="muted">Paste the Site ID and admin token shown after installation.</p>
      <div class="row">
        <input id="conn-site" placeholder="Site ID" />
        <input id="conn-token" type="password" placeholder="Admin token" />
        <button id="conn-save" class="btn primary">Connect</button>
      </div>
    </section>

    <div id="main" hidden>
      <div class="row space">
        <label><input type="checkbox" id="dry-run" /> Dry run (report only, write nothing)</label>
        <button id="sync-all" class="btn">Sync assets</button>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="assets">Assets</button>
        <button class="tab" data-tab="audit">Audit</button>
        <button class="tab" data-tab="alt">Alt text</button>
        <button class="tab" data-tab="optimize">Optimize</button>
        <button class="tab" data-tab="organize">Organize</button>
        <button class="tab" data-tab="report">Report</button>
        <button class="tab" data-tab="settings">Settings</button>
      </nav>
      <section id="view"></section>
    </div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script src="./panel.js"></script>
</body>
</html>
